<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Krittika Research Foundation" />
    <title>Krittika Research Foundation</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: #fff;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: #fff;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
        overflow-x: hidden;
      }

      .intro {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(2rem, 5vw, 5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      .project {
        width: min(100%, 112rem);
        margin: 0 auto;
        padding: clamp(5rem, 14vw, 15rem) clamp(1.25rem, 5vw, 6rem)
          clamp(8rem, 18vw, 20rem);
      }

      .project-visual {
        margin: 0;
      }

      .project-visual + .project-visual {
        margin-top: clamp(8rem, 18vw, 20rem);
      }

      .project-visual img {
        display: block;
        width: 100%;
        height: auto;
        mix-blend-mode: multiply;
      }

      @media (max-width: 700px) {
        .project {
          padding-inline: 0.75rem;
        }

        .project-visual + .project-visual {
          margin-top: 7rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header class="intro">
        <h1>Krittika “Research Foundation”</h1>
      </header>

      <section class="project" aria-label="Chennai flooding research project">
        <figure class="project-visual">
          <img
            src="assets/chennai-flooding/01-introduction.jpg"
            alt="Chennai flooding as a spatial condition: project introduction and aerial map"
          />
        </figure>

        <figure class="project-visual">
          <img
            src="assets/chennai-flooding/02-context.jpg"
            alt="Chennai flooding context, field photographs, and selected project readings"
            loading="lazy"
          />
        </figure>

        <figure class="project-visual">
          <img
            src="assets/chennai-flooding/03-archival-map.jpg"
            alt="Archival map of Madras showing its historical water systems"
            loading="lazy"
          />
        </figure>

        <figure class="project-visual">
          <img
            src="assets/chennai-flooding/04-hydrological-structure.jpg"
            alt="Historical hydrological structure overlaid on contemporary Chennai"
            loading="lazy"
          />
        </figure>
      </section>
    </main>
  </body>
</html>
