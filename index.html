<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Krittika Research Foundation — an evolving landscape of research."
    />
    <title>Krittika Research Foundation</title>

    <style>
      @font-face {
        font-family: "Neue Montreal";
        src: url("assets/fonts/NeueMontreal-Medium.otf") format("opentype");
        font-style: normal;
        font-weight: 500;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --background: #020303;
        --line-bright: rgba(220, 255, 248, 0.78);
        --line-mid: rgba(149, 218, 207, 0.43);
        --line-dim: rgba(118, 182, 173, 0.2);
        --node: #d9fff8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--background);
      }

      body {
        overflow: hidden;
        font-family: "Neue Montreal", "Helvetica Neue", Arial, sans-serif;
      }

      .landing {
        position: relative;
        width: 100%;
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 50% 72%,
            rgba(17, 66, 60, 0.16) 0%,
            rgba(2, 3, 3, 0) 56%
          ),
          #020303;
        isolation: isolate;
      }

      .network-landscape {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .network-landscape path,
      .network-landscape line,
      .network-landscape polyline {
        vector-effect: non-scaling-stroke;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .horizon {
        stroke: var(--line-bright);
        stroke-width: 1.15;
        filter: url("#soft-glow");
      }

      .ridge-secondary {
        stroke: var(--line-mid);
        stroke-width: 0.85;
      }

      .terrain {
        stroke: var(--line-dim);
        stroke-width: 0.72;
      }

      .cable {
        stroke: var(--line-mid);
        stroke-width: 0.9;
      }

      .cable--bright {
        stroke: rgba(218, 255, 248, 0.64);
      }

      .node {
        fill: var(--node);
        filter: url("#node-glow");
      }

      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 4.8s ease-in-out infinite;
      }

      .pulse:nth-of-type(2n) {
        animation-delay: -1.7s;
      }

      .pulse:nth-of-type(3n) {
        animation-delay: -3.1s;
      }

      .terrain-drift {
        animation: drift 22s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.75);
        }

        50% {
          opacity: 1;
          transform: scale(1.25);
        }
      }

      @keyframes drift {
        from {
          transform: translateX(-5px);
        }

        to {
          transform: translateX(7px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse,
        .terrain-drift {
          animation: none;
        }
      }
    </style>
  </head>

              <feMergeNode in="SourceGraphic" />

          <filter id="node-glow" x="-200%" y="-200%" width="400%" height="400%">
